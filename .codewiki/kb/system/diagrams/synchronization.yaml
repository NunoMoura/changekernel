codewiki_id: cw:diagram:synchronization
id: synchronization
purpose: Show Project Server-owned synchronization of exact Git refs, accepted Change history, reduced Knowledge State, and post-mutation Alignment under expected-head compare-and-swap.
components:
  - { id: project-server, concept: cw:component:project-server, label: Project Server, zone: core }
  - { id: project, concept: cw:component:project, label: Project Configuration, zone: repository }
  - { id: provider, concept: cw:component:provider-boundary, label: Trusted Git Host Boundary, zone: provider }
  - { id: change-trace, concept: cw:component:change-trace, label: Change Trace, zone: repository }
  - { id: knowledge, concept: cw:component:knowledge, label: Knowledge State, zone: repository }
  - { id: alignment, concept: cw:component:alignment, label: Alignment, zone: core }
connections:
  - id: project-server-reads-project
    from: project-server
    to: project
    type: reads
    label: binds configured repository and expected head
    boundary: { type: persistence, failure: Block synchronization when configuration cannot be verified. }
  - id: project-returns-project-server
    from: project
    to: project-server
    type: returns
    label: returns verified repository binding and expected head
    boundary: { type: persistence, failure: Block synchronization when configuration identity drifts. }
  - id: project-server-synchronizes-provider
    from: project-server
    to: provider
    type: synchronizes
    label: fetches or pushes exact refs
    boundary: { type: network, failure: Preserve local state and report unavailable remote acceptance. }
  - id: provider-returns-project-server
    from: provider
    to: project-server
    type: returns
    label: returns authenticated exact ref state
    boundary: { type: network, failure: Reject unauthenticated, stale, or contradictory provider state. }
  - id: project-server-writes-change-trace
    from: project-server
    to: change-trace
    type: writes
    label: accepts verified canonical history
    boundary: { type: persistence, failure: Preserve previous canonical head when append validation or compare-and-swap fails. }
  - id: change-trace-produces-alignment
    from: change-trace
    to: alignment
    type: produces
    label: projects accepted transition and realization provenance
    boundary: { type: persistence, failure: Block projection when canonical history cannot be reduced. }
  - id: project-server-writes-knowledge
    from: project-server
    to: knowledge
    type: writes
    label: commits the verified reduced Knowledge State checkpoint
    boundary: { type: persistence, failure: Preserve prior Knowledge and Trace heads when reduction or checkpoint comparison fails. }
  - id: knowledge-produces-alignment
    from: knowledge
    to: alignment
    type: produces
    label: projects stable desired-state identity
    boundary: { type: persistence, failure: Block projection when accepted Knowledge cannot be verified. }
  - { id: alignment-returns-project-server, from: alignment, to: project-server, type: returns, label: confirms synchronized identities }
flows:
  - concept: cw:flow:remote-state-synchronization
    paths:
      - connections: [project-server-reads-project, project-returns-project-server, project-server-synchronizes-provider, provider-returns-project-server, project-server-writes-change-trace, change-trace-produces-alignment, alignment-returns-project-server]
      - connections: [project-server-reads-project, project-returns-project-server, project-server-synchronizes-provider, provider-returns-project-server, project-server-writes-knowledge, knowledge-produces-alignment, alignment-returns-project-server]
