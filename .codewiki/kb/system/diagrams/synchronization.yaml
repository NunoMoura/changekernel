codewiki_id: cw:diagram:synchronization
id: synchronization
purpose: Show mandatory local Git canonical state plus Backend direct-remote and target Plugin-mediated remote synchronization.
components:
  - { id: project-server, concept: cw:component:project-server, label: Project Server, zone: core }
  - { id: project, concept: cw:component:project, label: Git Project Store / Configuration, zone: repository }
  - { id: plugins, concept: cw:component:package, label: CodeWiki Remote Plugin, zone: execution }
  - { id: provider, concept: cw:component:provider-boundary, label: External Project Provider, zone: provider }
  - { id: change-trace, concept: cw:component:change-trace, label: Change Trace, zone: repository }
  - { id: knowledge, concept: cw:component:knowledge, label: Git-versioned Wiki Items, zone: repository }
  - { id: alignment, concept: cw:component:alignment, label: Alignment, zone: core }
connections:
  - id: project-server-reads-project
    from: project-server
    to: project
    type: reads
    label: binds configured repository and expected head
    boundary: { type: persistence, failure: Block synchronization when configuration cannot be verified. }
  - id: project-returns-project-server
    from: project
    to: project-server
    type: returns
    label: returns verified repository binding and expected head
    boundary: { type: persistence, failure: Block synchronization when configuration identity drifts. }
  - id: project-server-synchronizes-provider
    from: project-server
    to: provider
    type: synchronizes
    label: Backend v1 fetches or pushes exact Git refs directly
    boundary: { type: network, failure: Preserve local state and report unavailable remote acceptance. }
  - id: provider-returns-project-server
    from: provider
    to: project-server
    type: returns
    label: Backend v1 returns authenticated exact ref state
    boundary: { type: network, failure: Reject unauthenticated, stale, or contradictory provider state. }
  - id: project-server-invokes-project-plugin
    from: project-server
    to: plugins
    type: invokes
    label: target submits capability-scoped remote.observe Request
    boundary: { type: authority, failure: Reject unadmitted manifest, excess capability, unauthorized effect, or stale expected head. }
  - id: plugin-synchronizes-provider
    from: plugins
    to: provider
    type: synchronizes
    label: performs exact provider mechanics under bounded Request
    boundary: { type: network, failure: Return stopped or failed Receipt without asserting canonical mutation. }
  - id: provider-returns-plugin
    from: provider
    to: plugins
    type: returns
    label: returns provider-native exact head and effect facts
    boundary: { type: network, failure: Reject unauthenticated, stale, contradictory, or malformed provider state. }
  - id: plugin-returns-project-server
    from: plugins
    to: project-server
    type: returns
    label: returns immutable Plugin Receipt without Result or completion authority
    boundary: { type: trust, failure: Reject incomplete, mismatched, or unauthorized Receipt. }
  - id: project-server-writes-change-trace
    from: project-server
    to: change-trace
    type: writes
    label: accepts verified canonical history
    boundary: { type: persistence, failure: Preserve previous canonical head when append validation or compare-and-swap fails. }
  - id: change-trace-produces-alignment
    from: change-trace
    to: alignment
    type: produces
    label: projects proposal, Wiki, completion, and effect provenance
    boundary: { type: persistence, failure: Block projection when canonical history cannot be reduced. }
  - id: project-server-writes-knowledge
    from: project-server
    to: knowledge
    type: writes
    label: validates objects and advances canonical Git ref by expected-old-OID CAS
    boundary: { type: persistence, failure: Preserve prior commit when Item, Trace, object, or ref validation fails. }
  - id: knowledge-produces-alignment
    from: knowledge
    to: alignment
    type: produces
    label: projects stable desired-state identity
    boundary: { type: persistence, failure: Block projection when accepted Knowledge cannot be verified. }
  - { id: alignment-returns-project-server, from: alignment, to: project-server, type: returns, label: confirms synchronized identities }
flows:
  - concept: cw:flow:remote-state-synchronization
    paths:
      - connections: [project-server-reads-project, project-returns-project-server, project-server-synchronizes-provider, provider-returns-project-server, project-server-writes-change-trace, change-trace-produces-alignment, alignment-returns-project-server]
      - connections: [project-server-reads-project, project-returns-project-server, project-server-invokes-project-plugin, plugin-synchronizes-provider, provider-returns-plugin, plugin-returns-project-server, project-server-writes-change-trace, change-trace-produces-alignment, alignment-returns-project-server]
      - connections: [project-server-reads-project, project-returns-project-server, project-server-synchronizes-provider, provider-returns-project-server, project-server-writes-knowledge, knowledge-produces-alignment, alignment-returns-project-server]
      - connections: [project-server-reads-project, project-returns-project-server, project-server-invokes-project-plugin, plugin-synchronizes-provider, provider-returns-plugin, plugin-returns-project-server, project-server-writes-knowledge, knowledge-produces-alignment, alignment-returns-project-server]
