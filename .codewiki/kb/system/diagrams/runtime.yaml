codewiki_id: cw:diagram:runtime
id: runtime
purpose: Show Project Server ownership around Runtime Runs, exact context, Implementation Workbenches, Checks, Gates, and recovery.
components:
  - { id: project-server, concept: cw:component:project-server, label: Project Server, zone: core }
  - { id: runtime, concept: cw:component:runtime, label: Runtime, zone: execution }
  - { id: session-continuity, concept: cw:component:project-server, label: Session Continuity Journal, zone: core }
  - { id: work-state, concept: cw:component:work-state, label: WorkState, zone: core }
  - { id: alignment, concept: cw:component:alignment, label: Alignment, zone: core }
  - { id: knowledge, concept: cw:component:knowledge, label: Knowledge, zone: repository }
  - { id: implementation, concept: cw:component:implementation, label: Implementation, zone: core }
  - { id: checks, concept: cw:component:checks, label: Checks, zone: core }
  - { id: intake, concept: cw:component:change-intake, label: Change Intake, zone: core }
  - { id: preview, concept: cw:component:preview, label: Preview, zone: execution }
  - { id: evidence, concept: cw:component:evidence, label: Evidence, zone: core }
  - { id: provider, concept: cw:component:provider-boundary, label: Private Provider Broker and Model Providers, zone: provider }
  - { id: change-trace, concept: cw:component:change-trace, label: Change Trace, zone: repository }
connections:
  - { id: project-server-reads-work-state, from: project-server, to: work-state, type: reads, label: builds Project Context Snapshots or Gate packages and selects ready Work Units }
  - id: project-server-reads-knowledge
    from: project-server
    to: knowledge
    type: reads
    label: resolves accepted intent for immutable Project Context Snapshot or Gate package
    boundary: { type: persistence, failure: Stop context creation when exact Knowledge is unavailable. }
  - id: knowledge-returns-project-server
    from: knowledge
    to: project-server
    type: returns
    label: returns exact accepted Knowledge snapshot
    boundary: { type: persistence, failure: Reject stale or digest-mismatched Knowledge. }
  - id: project-server-writes-session-continuity
    from: project-server
    to: session-continuity
    type: writes
    label: admits or advances one expected-head Session writer lease
  - id: session-continuity-returns-project-server
    from: session-continuity
    to: project-server
    type: returns
    label: returns current Session, head, Build, lease, Receipt, and rollover
  - id: project-server-invokes-runtime
    from: project-server
    to: runtime
    type: invokes
    label: submits Run, model Assignment, continuation, and Session lease
    boundary: { type: authority, failure: Reject stale context, unauthorized route, unsupported capability, unqualified Runtime Build, competing Session writer, invalid Workbench capability, or malformed request. }
  - id: runtime-invokes-provider
    from: runtime
    to: provider
    type: invokes
    label: streams through one authenticated loopback exact-Run broker capability
    boundary: { type: trust, failure: Stop on route mismatch, unauthenticated receipt, exhausted broker retry, quota, cancellation, or malformed provider evidence. }
  - id: provider-returns-runtime
    from: provider
    to: runtime
    type: returns
    label: returns normalized chunks and authenticated provider-call receipt
    boundary: { type: trust, failure: Refuse completion when selected target, request, response, usage, or receipt identity differs. }
  - id: runtime-returns-project-server
    from: runtime
    to: project-server
    type: returns
    label: returns Receipt with continuation and exact Session heads
    boundary: { type: authority, failure: Stop Run on malformed output, mismatched Session head or lease, incomplete ledger, undeclared custody gap, failed quiescence, or missing process-exit proof. }
  - { id: project-server-invokes-implementation, from: project-server, to: implementation, type: invokes, label: admits exact Runtime output to the active Assignment }
  - { id: implementation-returns-project-server, from: implementation, to: project-server, type: returns, label: returns exact Work Unit Candidate for policy and lineage admission }
  - id: project-server-invokes-preview
    from: project-server
    to: preview
    type: invokes
    label: requests Candidate-bound observation
    boundary: { type: authority, failure: Keep Candidate unchanged and report unavailable Preview. }
  - id: preview-produces-evidence
    from: preview
    to: evidence
    type: produces
    label: returns bounded observation metadata
    boundary: { type: authority, failure: Reject malformed or unbound observation. }
  - { id: project-server-invokes-checks, from: project-server, to: checks, type: invokes, label: starts exact Gate over frozen Gate Evaluation Package }
  - { id: checks-consume-evidence, from: checks, to: evidence, type: consumes, label: resolves exact bounded Check inputs }
  - id: checks-read-knowledge
    from: checks
    to: knowledge
    type: reads
    label: resolves bounded OKF facts for Check SDK
    boundary: { type: persistence, failure: Stop affected input resolution when exact Knowledge is unavailable. }
  - id: knowledge-returns-checks
    from: knowledge
    to: checks
    type: returns
    label: returns immutable OKF snapshot facts
    boundary: { type: persistence, failure: Reject stale, incomplete, or digest-mismatched facts. }
  - id: checks-invoke-runtime
    from: checks
    to: runtime
    type: invokes
    label: requests sandboxed Code Check or tool-free Model Check Run
    boundary: { type: authority, failure: Stop Check execution without creating a Check Result. }
  - id: runtime-returns-checks
    from: runtime
    to: checks
    type: returns
    label: returns bounded Check Output and Run Receipt or stopped fact
    boundary: { type: authority, failure: Reject malformed or unbound Check output. }
  - { id: checks-return-project-server, from: checks, to: project-server, type: returns, label: returns passed, failed, or stopped Gate Report }
  - id: project-server-writes-change-trace
    from: project-server
    to: change-trace
    type: writes
    label: appends Results, unit Gates, integration, and completion state
    boundary: { type: persistence, failure: Reject append and preserve prior accepted head. }
  - id: change-trace-returns-project-server
    from: change-trace
    to: project-server
    type: returns
    label: reloads accepted history
    boundary: { type: persistence, failure: Stop recovery on missing or invalid history. }
  - { id: work-state-produces-alignment, from: work-state, to: alignment, type: produces, label: projects coordination and provenance }
  - { id: alignment-returns-project-server, from: alignment, to: project-server, type: returns, label: returns impact, provenance, and contribution-routing facts }
  - { id: project-server-invokes-intake, from: project-server, to: intake, type: invokes, label: sends unmatched external capture to accountable intent }
  - { id: intake-returns-project-server, from: intake, to: project-server, type: returns, label: returns admitted intake state }
flows:
  - concept: cw:flow:change-lifecycle
    paths:
      - connections: [project-server-reads-knowledge, knowledge-returns-project-server, project-server-invokes-runtime, runtime-invokes-provider, provider-returns-runtime, runtime-returns-project-server]
  - concept: cw:flow:work-unit-execution
    paths:
      - connections: [project-server-invokes-runtime, runtime-invokes-provider, provider-returns-runtime, runtime-returns-project-server, project-server-invokes-implementation, implementation-returns-project-server, project-server-invokes-preview, preview-produces-evidence]
      - connections: [project-server-invokes-checks, checks-read-knowledge, knowledge-returns-checks, checks-invoke-runtime, runtime-returns-checks, checks-return-project-server, project-server-writes-change-trace]
  - concept: cw:flow:external-candidate-admission
    paths:
      - connections: [change-trace-returns-project-server, project-server-invokes-intake, intake-returns-project-server, project-server-invokes-checks]
  - concept: cw:flow:recovery
    paths:
      - connections: [change-trace-returns-project-server, project-server-reads-work-state, work-state-produces-alignment, alignment-returns-project-server]
      - connections: [session-continuity-returns-project-server, project-server-reads-work-state, work-state-produces-alignment, alignment-returns-project-server]
      - connections: [project-server-writes-session-continuity, session-continuity-returns-project-server]
