[package]
name = "changekernel"
version = "0.4.0-sk3g.1"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "changekernel"
path = "src/main.rs"

[[test]]
name = "native_bootstrap"
path = "tests/package/native_bootstrap.rs"

[[test]]
name = "native_intake"
path = "tests/kernel/containers/native_intake.rs"

[[test]]
name = "native_intake_sqlite"
path = "tests/adapters/sqlite/native_intake.rs"

[dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.145"
