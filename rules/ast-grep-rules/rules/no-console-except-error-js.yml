id: no-console-except-error-js
language: JavaScript
severity: warning
message: "Avoid console.log/debug/warn in production code — use a logger or console.error inside catch only"
note: |
  Production logging must use the owned logging boundary. Tests and scripts are
  excluded because console output is their explicit smoke-test or CLI contract.
  B10 audited all five test findings.
ignores:
  - "tests/**"
  - "scripts/**"
  - "bin/**"
  - "**/logger.js"
  - "**/logger.mjs"
rule:
  any:
    - pattern: console.error($$$)
      not:
        inside:
          kind: catch_clause
          stopBy: end
    - pattern: console.$METHOD($$$)
constraints:
  METHOD:
    regex: "log|debug|warn"
