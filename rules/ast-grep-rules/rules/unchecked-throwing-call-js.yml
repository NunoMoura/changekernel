id: unchecked-throwing-call-js
language: JavaScript
severity: error
message: "$CALL without try/catch — throws on invalid input"
note: |
  Production JavaScript must handle malformed JSON, invalid URLs, and non-zero
  synchronous command exits at the boundary. Test code is excluded because its
  inputs are controlled fixtures and a thrown exception correctly fails the
  test. B10 audited all 15 excluded findings; none was in production code.
ignores:
  - "tests/**"
rule:
  any:
    - pattern: JSON.parse($INPUT)
    - pattern: new URL($URL)
    - pattern: execSync($CMD)
    - pattern: execSync($CMD, $OPTS)
  not:
    inside:
      stopBy: end
      kind: try_statement
